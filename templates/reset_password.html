<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutomatIA — Nueva Contraseña</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style nonce="{{ csp_nonce() }}">
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg: #060910; --surface: #0d1117; --border: rgba(255,255,255,0.07); --accent: #00E5C3; --text: #F0F4FF; --muted: #7A8FAD; --error: #F87171; --success: #34D399; }
  body { background: var(--bg); color: var(--text); font-family: "DM Sans", sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
  .orb { position: fixed; border-radius: 50%; filter: blur(120px); pointer-events: none; z-index: 0; opacity: 0.1; }
  .orb-1 { width: 500px; height: 500px; background: var(--accent); top: -150px; left: -100px; }
  .orb-2 { width: 400px; height: 400px; background: #3B82F6; bottom: -100px; right: -100px; }
  .card { position: relative; z-index: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 2.5rem; width: 100%; max-width: 420px; }
  .logo { font-family: "Syne", sans-serif; font-size: 1.5rem; font-weight: 800; color: var(--text); text-decoration: none; display: block; text-align: center; margin-bottom: 0.5rem; }
  .logo span { color: var(--accent); }
  .icon { text-align: center; font-size: 2.5rem; margin-bottom: 0.5rem; }
  .subtitle { text-align: center; color: var(--muted); font-size: 0.875rem; margin-bottom: 2rem; line-height: 1.6; }
  .flash { padding: 0.75rem 1rem; border-radius: 10px; font-size: 0.85rem; margin-bottom: 1.25rem; }
  .flash.danger  { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.2); color: var(--error); }
  .flash.success { background: rgba(52,211,153,0.1);  border: 1px solid rgba(52,211,153,0.2);  color: var(--success); }
  .form-group { margin-bottom: 1rem; }
  label { display: block; font-size: 0.8rem; font-weight: 500; color: var(--muted); margin-bottom: 0.4rem; letter-spacing: 0.04em; text-transform: uppercase; }
  input { width: 100%; background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 10px; padding: 0.75rem 1rem; color: var(--text); font-family: "DM Sans", sans-serif; font-size: 0.9rem; transition: border-color 0.2s; outline: none; }
  input:focus { border-color: rgba(0,229,195,0.4); }
  input::placeholder { color: var(--muted); }
  .strength-bar { height: 4px; border-radius: 2px; margin-top: 0.5rem; background: var(--border); overflow: hidden; }
  .strength-fill { height: 100%; border-radius: 2px; transition: width 0.3s, background 0.3s; width: 0%; }
  .strength-label { font-size: 0.72rem; color: var(--muted); margin-top: 0.3rem; }
  .btn { display: block; width: 100%; background: var(--accent); color: #030F0D; border: none; border-radius: 100px; padding: 0.85rem; font-size: 0.95rem; font-weight: 600; cursor: pointer; margin-top: 1.5rem; transition: opacity 0.2s, transform 0.2s; font-family: "DM Sans", sans-serif; }
  .btn:hover { opacity: 0.9; transform: translateY(-1px); }
  .divider { border: none; border-top: 1px solid var(--border); margin: 1.5rem 0; }
  .link-row { text-align: center; font-size: 0.85rem; color: var(--muted); }
  .link-row a { color: var(--accent); text-decoration: none; font-weight: 500; }
</style>
</head>
<body>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="card">
  <a href="/" class="logo">Automat<span>IA</span></a>
  <div class="icon">🔒</div>
  <p class="subtitle">Elige una nueva contraseña segura para tu cuenta.</p>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}

  <form method="POST">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label>Nueva contraseña</label>
      <input type="password" name="password" id="pw1" placeholder="Mínimo 10 caracteres"
             required autocomplete="new-password" autofocus minlength="10">
      <div class="strength-bar"><div class="strength-fill" id="str-fill"></div></div>
      <div class="strength-label" id="str-label"></div>
    </div>
    <div class="form-group">
      <label>Confirmar contraseña</label>
      <input type="password" name="password2" id="pw2" placeholder="Repite la contraseña"
             required autocomplete="new-password">
    </div>
    <button type="submit" class="btn">Guardar nueva contraseña</button>
  </form>

  <hr class="divider">
  <p class="link-row"><a href="{{ url_for('login') }}">← Volver al inicio de sesión</a></p>
</div>

<script nonce="{{ csp_nonce() }}">
  const pw1 = document.getElementById('pw1');
  const fill = document.getElementById('str-fill');
  const label = document.getElementById('str-label');
  pw1.addEventListener('input', () => {
    const v = pw1.value;
    let score = 0;
    if (v.length >= 10) score++;
    if (v.length >= 14) score++;
    if (/[A-Z]/.test(v)) score++;
    if (/[0-9]/.test(v)) score++;
    if (/[^A-Za-z0-9]/.test(v)) score++;
    const pct = Math.min(score / 5 * 100, 100);
    const colors = ['#F87171','#F59E0B','#F59E0B','#34D399','#00E5C3'];
    const labels = ['Muy débil','Débil','Regular','Fuerte','Muy fuerte'];
    fill.style.width = pct + '%';
    fill.style.background = colors[score - 1] || '#F87171';
    label.textContent = v.length ? labels[score - 1] || 'Muy débil' : '';
    label.style.color = colors[score - 1] || '#F87171';
  });
</script>
</body>
</html>
